<!-- Logo de Microsoft: los cuatro cuadros, en sus colores oficiales. Va en color y no en blanco
     como el resto de iconos porque es una marca: sus normas de uso piden el logotipo tal cual, y
     ademas asi se ve igual sobre el boton de contorno y sobre uno relleno. -->
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <rect x="2"  y="2"  width="9" height="9" fill="#F25022"/>
  <rect x="13" y="2"  width="9" height="9" fill="#7FBA00"/>
  <rect x="2"  y="13" width="9" height="9" fill="#00A4EF"/>
  <rect x="13" y="13" width="9" height="9" fill="#FFB900"/>
</svg>
