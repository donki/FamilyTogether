<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Family Together</title>
    <!--
        MapLibre GL JS 4.7.1 EMPAQUETADO en la app (BSD-3, ver maplibre-LICENSE.txt): nada de CDN
        (constitucion Mobile 10). El WebView carga esta pagina con base file:///android_asset/, asi
        que las rutas relativas llegan a los ficheros de Resources\Raw.
        Estilo vectorial de OpenFreeMap, sin clave. La atribucion de OpenStreetMap se deja visible
        (plegada), como pide su licencia.
    -->
    <link href="maplibre-gl.css" rel="stylesheet" />
    <style>
        html, body { margin: 0; padding: 0; height: 100%; background-color: #E8E6F5; }
        #map { position: absolute; top: 0; bottom: 0; left: 0; right: 0; }
        .fl-marker { display: flex; flex-direction: column; align-items: center; cursor: pointer; }
        .fl-dot {
            width: 40px; height: 40px; border-radius: 50%; border: 3px solid #FFFFFF;
            box-shadow: 0 1px 5px rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center;
            color: #FFFFFF; font: bold 15px sans-serif; background-size: cover; background-position: center;
        }
        .fl-dot.stale { opacity: .6; }
        .fl-name {
            margin-top: 2px; padding: 1px 6px; border-radius: 8px; background: rgba(255,255,255,.92);
            color: #191C1D; font: 12px sans-serif; white-space: nowrap; max-width: 140px; overflow: hidden; text-overflow: ellipsis;
        }
        .fl-zone-label {
            padding: 1px 6px; border-radius: 8px; background: rgba(53,37,205,.85); color: #FFFFFF;
            font: 12px sans-serif; white-space: nowrap;
        }
        .fl-stop { width: 22px; height: 22px; border-radius: 50%; background: #FFFFFF; border: 5px solid #3525CD; box-shadow: 0 1px 4px rgba(0,0,0,.5); box-sizing: border-box; }
        .fl-end { width: 16px; height: 16px; border-radius: 50%; border: 3px solid #FFFFFF; box-shadow: 0 1px 4px rgba(0,0,0,.5); }
        .fl-edit-center { width: 14px; height: 14px; border-radius: 50%; background: #3525CD; border: 3px solid #FFFFFF; box-shadow: 0 1px 4px rgba(0,0,0,.5); }
    </style>
</head>
<body>
    <div id="map"></div>

    <script src="maplibre-gl.js"></script>
    <script>
        // Interfaz con C# (Controls/MapView.cs): funciones globales que se llaman con
        // EvaluateJavaScriptAsync, y una cola de eventos (toques) que C# recoge con takeEvents().
        // Los eventos van como texto plano sin comillas («tap|lat|lon;member|id»): asi no hay que
        // pelearse con como devuelve cada WebView una cadena JSON escapada.
        var map = new maplibregl.Map({
            container: 'map',
            style: 'https://tiles.openfreemap.org/styles/liberty',
            center: [-3.7038, 40.4168],  // [lng, lat]: MapLibre usa lng,lat
            zoom: 5,
            attributionControl: false
        });
        map.addControl(new maplibregl.AttributionControl({ compact: true }), 'bottom-left');
        // La atribucion de OpenFreeMap / OpenStreetMap es obligatoria (licencia ODbL), pero va
        // plegada en el boton «i»: MapLibre la abre sola al cargar y tapaba el pie del mapa.
        function foldAttribution() {
            var a = document.querySelector('.maplibregl-ctrl-attrib');
            if (a) { a.removeAttribute('open'); a.classList.remove('maplibregl-compact-show'); }
        }
        map.on('load', function () { foldAttribution(); setTimeout(foldAttribution, 500); });
        map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'top-right');

        var styleReady = false;
        var events = [];
        var tapEnabled = false;
        var memberMarkers = {};
        var memberPositions = {};
        var zoneLabels = [];
        var trackMarkers = [];
        var editMarker = null;
        var edit = null;   // { lat, lon, r }

        function whenReady(fn) {
            if (styleReady) { fn(); return; }
            map.once('load', function () { styleReady = true; fn(); });
        }
        map.on('load', function () { styleReady = true; ensureLayers(); });

        function push(ev) { events.push(ev); if (events.length > 50) events.shift(); }
        function takeEvents() { var s = events.join(';'); events = []; return s; }

        map.on('click', function (e) {
            if (!tapEnabled) return;
            var lat = e.lngLat.lat, lon = e.lngLat.lng;
            push('tap|' + lat.toFixed(6) + '|' + lon.toFixed(6));
            if (edit) { edit.lat = lat; edit.lon = lon; drawEdit(); }
        });

        // ---------- capas ----------

        function emptyFc() { return { type: 'FeatureCollection', features: [] }; }

        function ensureLayers() {
            if (map.getSource('zones')) return;
            map.addSource('zones', { type: 'geojson', data: emptyFc() });
            map.addLayer({ id: 'zones-fill', type: 'fill', source: 'zones', paint: { 'fill-color': '#3525CD', 'fill-opacity': 0.12 } });
            map.addLayer({ id: 'zones-line', type: 'line', source: 'zones', paint: { 'line-color': '#3525CD', 'line-width': 2, 'line-opacity': 0.8 } });

            map.addSource('edit', { type: 'geojson', data: emptyFc() });
            map.addLayer({ id: 'edit-fill', type: 'fill', source: 'edit', paint: { 'fill-color': '#C2185B', 'fill-opacity': 0.18 } });
            map.addLayer({ id: 'edit-line', type: 'line', source: 'edit', paint: { 'line-color': '#C2185B', 'line-width': 2.5 } });

            map.addSource('me', { type: 'geojson', data: emptyFc() });
            map.addLayer({ id: 'me-accuracy', type: 'fill', source: 'me', paint: { 'fill-color': '#1E88E5', 'fill-opacity': 0.15 } });
            map.addLayer({ id: 'me-accuracy-line', type: 'line', source: 'me', paint: { 'line-color': '#1E88E5', 'line-width': 1, 'line-opacity': 0.5 } });

            map.addSource('track', { type: 'geojson', data: emptyFc() });
            map.addLayer({
                id: 'track', type: 'line', source: 'track',
                layout: { 'line-join': 'round', 'line-cap': 'round' },
                paint: { 'line-color': '#3525CD', 'line-width': 4, 'line-opacity': 0.9 }
            });
        }

        // Circulo aproximado con 64 lados, en metros.
        function circle(lat, lon, r) {
            var pts = [], n = 64;
            var dLat = r / 111320;
            var dLon = r / (111320 * Math.cos(lat * Math.PI / 180));
            for (var i = 0; i <= n; i++) {
                var a = (i / n) * 2 * Math.PI;
                pts.push([lon + dLon * Math.cos(a), lat + dLat * Math.sin(a)]);
            }
            return { type: 'Feature', geometry: { type: 'Polygon', coordinates: [pts] }, properties: {} };
        }

        function boundsOf(points) {
            var b = new maplibregl.LngLatBounds(points[0], points[0]);
            for (var i = 1; i < points.length; i++) b.extend(points[i]);
            return b;
        }

        // ---------- miembros ----------

        // list: [{ id, name, initials, color, avatar (base64 PNG o null), lat, lon, stale }]
        function setMembers(list) {
            var seen = {};
            (list || []).forEach(function (m) {
                seen[m.id] = true;
                memberPositions[m.id] = [m.lon, m.lat];
                var marker = memberMarkers[m.id];
                if (!marker) {
                    var el = document.createElement('div');
                    el.className = 'fl-marker';
                    el.innerHTML = '<div class="fl-dot"></div><div class="fl-name"></div>';
                    el.addEventListener('click', function (ev) { ev.stopPropagation(); push('member|' + m.id); });
                    marker = new maplibregl.Marker({ element: el, anchor: 'top', offset: [0, -22] }).setLngLat([m.lon, m.lat]).addTo(map);
                    memberMarkers[m.id] = marker;
                }
                var root = marker.getElement();
                var dot = root.querySelector('.fl-dot');
                dot.style.backgroundColor = m.color;
                if (m.avatar) { dot.style.backgroundImage = 'url(data:image/png;base64,' + m.avatar + ')'; dot.textContent = ''; }
                else { dot.style.backgroundImage = 'none'; dot.textContent = m.initials; }
                dot.className = 'fl-dot' + (m.stale ? ' stale' : '');
                root.querySelector('.fl-name').textContent = m.name;
                marker.setLngLat([m.lon, m.lat]);
            });
            Object.keys(memberMarkers).forEach(function (id) {
                if (!seen[id]) { memberMarkers[id].remove(); delete memberMarkers[id]; delete memberPositions[id]; }
            });
        }

        function focusMember(id) {
            var p = memberPositions[id];
            if (p) map.easeTo({ center: p, zoom: Math.max(map.getZoom(), 15), duration: 600 });
        }

        function fitMembers() {
            var pts = Object.keys(memberPositions).map(function (k) { return memberPositions[k]; });
            if (pts.length === 0) return;
            if (pts.length === 1) { map.easeTo({ center: pts[0], zoom: 15, duration: 600 }); return; }
            map.fitBounds(boundsOf(pts), { padding: 60, maxZoom: 16, duration: 600 });
        }

        function center(lat, lon, zoom) {
            map.easeTo({ center: [lon, lat], zoom: zoom || 15, duration: 600 });
        }

        // ---------- mi posicion (punto azul con su precision) ----------

        var meMarker = null;
        function setMe(lat, lon, acc) {
            whenReady(function () {
                ensureLayers();
                map.getSource('me').setData({ type: 'FeatureCollection', features: [circle(lat, lon, Math.max(acc || 0, 5))] });
                if (!meMarker) {
                    var el = document.createElement('div');
                    el.style.cssText = 'width:18px;height:18px;border-radius:50%;background:#1E88E5;border:3px solid #fff;box-shadow:0 0 6px rgba(0,0,0,.4)';
                    meMarker = new maplibregl.Marker({ element: el }).setLngLat([lon, lat]).addTo(map);
                } else {
                    meMarker.setLngLat([lon, lat]);
                }
            });
        }

        // ---------- zonas ----------

        // list: [{ id, name, lat, lon, r }]
        function setZones(list) {
            whenReady(function () {
                ensureLayers();
                zoneLabels.forEach(function (m) { m.remove(); });
                zoneLabels = [];
                var fc = emptyFc();
                (list || []).forEach(function (z) {
                    fc.features.push(circle(z.lat, z.lon, z.r));
                    var el = document.createElement('div');
                    el.className = 'fl-zone-label';
                    el.textContent = z.name;
                    zoneLabels.push(new maplibregl.Marker({ element: el }).setLngLat([z.lon, z.lat]).addTo(map));
                });
                map.getSource('zones').setData(fc);
            });
        }

        function fitZones(list) {
            var pts = (list || []).map(function (z) { return [z.lon, z.lat]; });
            if (pts.length === 0) return;
            if (pts.length === 1) { map.easeTo({ center: pts[0], zoom: 15, duration: 600 }); return; }
            map.fitBounds(boundsOf(pts), { padding: 80, maxZoom: 16, duration: 600 });
        }

        // ---------- edicion de una zona ----------

        function setTapEnabled(on) { tapEnabled = !!on; }

        function editZone(lat, lon, r) {
            edit = { lat: lat, lon: lon, r: r };
            tapEnabled = true;
            drawEdit();
            fitCircle();
        }

        function setEditRadius(r) {
            if (!edit) return;
            edit.r = r;
            drawEdit();
        }

        function drawEdit() {
            whenReady(function () {
                ensureLayers();
                var fc = emptyFc();
                if (edit) fc.features.push(circle(edit.lat, edit.lon, edit.r));
                map.getSource('edit').setData(fc);
            });
            if (!edit) { if (editMarker) { editMarker.remove(); editMarker = null; } return; }
            if (!editMarker) {
                var el = document.createElement('div');
                el.className = 'fl-edit-center';
                editMarker = new maplibregl.Marker({ element: el }).setLngLat([edit.lon, edit.lat]).addTo(map);
            } else {
                editMarker.setLngLat([edit.lon, edit.lat]);
            }
        }

        function fitCircle() {
            if (!edit) return;
            var dLat = edit.r / 111320;
            var dLon = edit.r / (111320 * Math.cos(edit.lat * Math.PI / 180));
            map.fitBounds([[edit.lon - dLon, edit.lat - dLat], [edit.lon + dLon, edit.lat + dLat]], { padding: 50, maxZoom: 17, duration: 500 });
        }

        // ---------- recorrido (historial) ----------

        // points: [[lat, lon], ...]; startColor / endColor: el punto de inicio y el de fin (la
        // leyenda con los textos la pinta la pagina de C#).
        function setTrack(points, startColor, endColor) {
            clearTrack();
            var coords = (points || []).map(function (p) { return [p[1], p[0]]; });
            whenReady(function () {
                ensureLayers();
                map.getSource('track').setData({ type: 'Feature', geometry: { type: 'LineString', coordinates: coords }, properties: {} });
            });
            if (coords.length === 0) return;
            trackMarkers.push(endMarker(coords[0], startColor));
            if (coords.length > 1) trackMarkers.push(endMarker(coords[coords.length - 1], endColor));
            if (coords.length === 1) map.easeTo({ center: coords[0], zoom: 15, duration: 600 });
            else map.fitBounds(boundsOf(coords), { padding: 50, maxZoom: 17, duration: 600 });
        }

        function endMarker(pos, color) {
            var el = document.createElement('div');
            el.className = 'fl-end';
            el.style.backgroundColor = color;
            return new maplibregl.Marker({ element: el }).setLngLat(pos).addTo(map);
        }

        // Paradas largas del historial: [[lat, lon, texto], ...]. Un punto con aro; al tocarlo, el texto.
        function addStops(stops) {
            (stops || []).forEach(function (s) {
                var el = document.createElement('div');
                el.className = 'fl-stop';
                var marker = new maplibregl.Marker({ element: el }).setLngLat([s[1], s[0]]);
                if (s[2]) marker.setPopup(new maplibregl.Popup({ offset: 14, closeButton: false }).setText(s[2]));
                trackMarkers.push(marker.addTo(map));
            });
        }

        function clearTrack() {
            trackMarkers.forEach(function (m) { m.remove(); });
            trackMarkers = [];
            whenReady(function () { ensureLayers(); map.getSource('track').setData(emptyFc()); });
        }

        window.setMembers = setMembers;
        window.focusMember = focusMember;
        window.fitMembers = fitMembers;
        window.center = center;
        window.setMe = setMe;
        window.setZones = setZones;
        window.fitZones = fitZones;
        window.setTapEnabled = setTapEnabled;
        window.editZone = editZone;
        window.setEditRadius = setEditRadius;
        window.setTrack = setTrack;
        window.clearTrack = clearTrack;
        window.addStops = addStops;
        window.takeEvents = takeEvents;
        window.mapReady = true;
    </script>
</body>
</html>
